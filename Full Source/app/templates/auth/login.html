{% extends "base.html" %}

{% block title %}로그인 - WeTube{% endblock %}

{% block content %}
<div class="container auth-container">
    <div class="auth-box">
        <h1 class="auth-title">로그인</h1>
        
        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            {% if request.args.get('next') %}
            <input type="hidden" name="next" value="{{ request.args.get('next') | e }}"/>
            {% endif %}
            <div class="form-group">
                <label for="username">사용자명 또는 이메일</label>
                <input type="text" id="username" name="username" class="form-control" 
                       placeholder="사용자명 또는 이메일 입력" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" class="form-control" 
                       required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">로그인</button>
        </form>
        
        <div class="auth-links">
            <p>계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a></p>
        </div>
    </div>
</div>
{% endblock %}
