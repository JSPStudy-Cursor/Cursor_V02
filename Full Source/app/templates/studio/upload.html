{% extends "base.html" %}

{% block title %}동영상 업로드 - WeTube{% endblock %}

{% block content %}
<div class="container upload-container">
    <h1 class="page-title">동영상 업로드</h1>
    
    <form method="POST" enctype="multipart/form-data" class="upload-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="title">제목 *</label>
            <input type="text" id="title" name="title" class="form-control" required 
                   placeholder="동영상 제목을 입력하세요">
        </div>
        
        <div class="form-group">
            <label for="description">설명</label>
            <textarea id="description" name="description" class="form-control" rows="5" 
                      placeholder="동영상에 대한 설명을 입력하세요"></textarea>
        </div>
        
        <div class="form-group">
            <label for="category">카테고리</label>
            <select id="category" name="category" class="form-control">
                <option value="">카테고리 선택 (선택사항)</option>
                {% for key, value in config.VIDEO_CATEGORIES.items() %}
                <option value="{{ key }}">{{ value }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="tags">태그</label>
            <input type="text" id="tags" name="tags" class="form-control" 
                   placeholder="태그를 쉼표로 구분하여 입력하세요 (예: 태그1, 태그2, 태그3)">
            <small class="form-text">태그는 쉼표로 구분하여 입력하세요. 최대 50자까지 가능합니다.</small>
        </div>
        
        <div class="form-group">
            <label for="video">동영상 파일 *</label>
            <input type="file" id="video" name="video" class="form-control" 
                   accept="video/*" required>
            <small class="form-text">지원 형식: MP4, AVI, MOV, MKV, WEBM (최대 100MB)</small>
        </div>
        
        <div class="form-group">
            <label for="thumbnail">썸네일 이미지</label>
            <input type="file" id="thumbnail" name="thumbnail" class="form-control" 
                   accept="image/*">
            <small class="form-text">지원 형식: JPG, PNG, GIF, WEBP</small>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">업로드</button>
            <a href="{{ url_for('studio.index') }}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
{% endblock %}
